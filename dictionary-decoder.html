<title>Dictionary Decoder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@500;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap">
<style>
/* Layout: one column, four short lessons. The compressed text reads as prose with dashed emoji tokens; the library of replaced strings sits below it as draggable rows. */
:root{
  --bg:#E8EEEC; --surface:#F7FAF9; --fg:#10201C; --muted:#566763; --line:#C3D0CB;
  --accent:#0B7A66; --accent-ink:#FFFFFF;
  --flash:#F2BE3D; --bad:#B4321D;
  --font-display:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1412; --surface:#131D1A; --fg:#E3EFEB; --muted:#8FA8A1; --line:#243630;
    --accent:#4FD1B5; --accent-ink:#06201A; --flash:#E8B93C; --bad:#FF9A85;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1412; --surface:#131D1A; --fg:#E3EFEB; --muted:#8FA8A1; --line:#243630;
  --accent:#4FD1B5; --accent-ink:#06201A; --flash:#E8B93C; --bad:#FF9A85;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-display);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:20px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:640px;margin-inline:auto;display:grid;gap:16px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{margin:0;font:800 28px/1.1 var(--font-display);letter-spacing:-.02em}
.how{margin:6px 0 0;color:var(--muted);font-size:14px;max-width:48ch}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--muted);padding:8px 14px;font-weight:700;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.steps{display:flex;flex-wrap:wrap;gap:8px}
.step{width:40px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:700 15px var(--font-mono)}
.step.ok{border-color:var(--accent);color:var(--accent)}
.step.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.lesson{display:grid;gap:6px}
h2{margin:0;font:800 20px/1.25 var(--font-display);text-wrap:balance}
.lesson p{margin:0;max-width:60ch}
.lesson .task{font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.tools{display:flex;gap:8px}
.minibtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:700;font-size:13px}
.minibtn:disabled{opacity:.45;cursor:default}
.doc{padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:18px;line-height:2.3;white-space:pre-wrap;overflow-wrap:anywhere}
.t.x1{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.t.x2{background:color-mix(in srgb,var(--accent) 34%,transparent)}
.t.x3{background:color-mix(in srgb,var(--accent) 50%,transparent)}
.t.pop{animation:flash .7s ease-out}
@keyframes flash{from{background:var(--flash)}}
.tok{display:inline-grid;place-items:center;min-width:36px;height:36px;margin-inline:1px;padding:0 4px;vertical-align:middle;border:2px dashed var(--accent);border-radius:8px;background:transparent;font-size:20px;line-height:1}
.tok.x1{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.tok.x2{background:color-mix(in srgb,var(--accent) 34%,transparent)}
.tok.x3{background:color-mix(in srgb,var(--accent) 50%,transparent)}
.doc.armed .tok{border-style:solid}
.tok.over,.tok:hover{border-style:solid;background:color-mix(in srgb,var(--accent) 30%,transparent)}
.tok.no{animation:shake .35s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.lib{display:grid;gap:8px}
.entry{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--surface);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.entry[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.entry.lifted{opacity:.45}
.entry.pulse{animation:pulse .7s ease-out}
@keyframes pulse{from{box-shadow:0 0 0 0 var(--accent)}to{box-shadow:0 0 0 10px transparent}}
.entry .em{font-size:26px;line-height:1}
.entry .eq{color:var(--muted);font-family:var(--font-mono)}
.entry .str{flex:1;min-width:0;font:500 15px/1.4 var(--font-mono);overflow-wrap:anywhere}
.entry .cnt{flex:none;min-width:34px;text-align:center;padding:2px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font:700 12px var(--font-mono)}
.entry .cnt.ok{color:var(--accent);border-color:var(--accent)}
.ghost{position:fixed;left:0;top:0;z-index:50;max-width:260px;padding:8px 14px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:600 14px var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.28)}
.msg{margin:0;min-height:1.5em;color:var(--muted);font-size:14px}
.msg.bad{color:var(--bad)}
.res{display:grid;gap:12px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.status{font:800 20px var(--font-display);color:var(--accent)}
.res p{margin:0}
.comp{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.comp .label{flex-basis:100%}
.comp .ratio{font:800 28px/1.1 var(--font-mono);font-variant-numeric:tabular-nums;color:var(--accent)}
.comp .ratio.bad{color:var(--bad)}
.comp .meta{color:var(--muted);font-size:13px;min-width:0}
.btn{justify-self:start;min-width:140px;padding:12px 20px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:15px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<main class="app">
  <header class="top">
    <div>
      <h1>Dictionary Decoder</h1>
      <p class="how" data-t="how"></p>
    </div>
    <div class="seg" role="group" aria-label="Language">
      <button type="button" id="l-uk" aria-pressed="true">UA</button>
      <button type="button" id="l-en" aria-pressed="false">EN</button>
    </div>
  </header>

  <nav class="steps" id="steps"></nav>

  <section class="lesson">
    <h2 id="l-title"></h2>
    <p id="l-intro"></p>
    <p class="task" id="l-task"></p>
  </section>

  <div class="row">
    <span class="label" data-t="text_l"></span>
    <span class="tools">
      <button type="button" class="minibtn" id="step" data-t="step"></button>
      <button type="button" class="minibtn" id="reset" data-t="reset"></button>
    </span>
  </div>
  <div class="doc" id="doc"></div>

  <div class="label" data-t="lib_l"></div>
  <div class="lib" id="lib"></div>
  <p class="msg" id="msg" aria-live="polite"></p>

  <section class="res" id="res" hidden aria-live="polite">
    <div class="status" id="r-status"></div>
    <p id="r-after"></p>
    <div class="comp" id="comp"></div>
    <button type="button" class="btn" id="next"></button>
  </section>
</main>

        after: 'The entry costs 3 characters and saves only 2, so the package got longer. Short phrases that repeat twice rarely pay off.' }
    ]
  };
  LES.en[3].text = 'how much 🌲 would a 🐹 🔨 if a 🐹 could 🔨 🌲';

  var S = { lang: 'uk', i: 0, nodes: [], lib: {}, emo: [], re: null, armed: null, solved: false, used: {}, done: {}, suppressUntil: 0 };

  function t(k) { return T[S.lang][k]; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function len(s) { return Array.from(s).length; }

  function parse(str, depth) {
    var out = [];
    str.split(S.re).forEach(function (p, j) {
      if (!p) return;
      if (j % 2) out.push({ k: 'tok', e: p, d: depth }); else out.push({ k: 'txt', s: p, d: depth });
    });
    return out;
  }
  function expandAll(str) {
    var g = new RegExp(S.emo.join('|'), 'g');
    return str.replace(g, function (m) { return expandAll(S.lib[m]); });
  }
  function countTok(e) { return S.nodes.filter(function (n) { return n.k === 'tok' && n.e === e; }).length; }

  function applyLang() {
    document.documentElement.lang = S.lang;
    Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (el) { el.textContent = t(el.getAttribute('data-t')); });
    $('l-uk').setAttribute('aria-pressed', String(S.lang === 'uk'));
    $('l-en').setAttribute('aria-pressed', String(S.lang === 'en'));
  }
  function say(text, bad) { var m = $('msg'); m.textContent = text; m.className = 'msg' + (bad ? ' bad' : ''); }

  function renderSteps() {
    $('steps').innerHTML = LES[S.lang].map(function (L, i) {
      return '<button type="button" class="step' + (i === S.i ? ' on' : '') + (S.done[S.lang + i] ? ' ok' : '') + '" data-i="' + i + '" aria-current="' + (i === S.i) + '" aria-label="' + esc(t('lesson') + ' ' + (i + 1) + ': ' + L.title) + '">' + (i + 1) + '</button>';
    }).join('');
  }
  function renderDoc() {
    var h = '';
    S.nodes.forEach(function (n, i) {
      var x = n.d ? ' x' + Math.min(n.d, 3) : '';
      if (n.k === 'txt') h += '<span class="t' + x + (n.fresh ? ' pop' : '') + '">' + esc(n.s) + '</span>';
      else h += '<button type="button" class="tok' + x + '" data-i="' + i + '" aria-label="' + esc(t('tokLabel')(n.e)) + '">' + n.e + '</button>';
      n.fresh = false;
    });
    $('doc').innerHTML = h;
    $('doc').classList.toggle('armed', S.armed !== null);
  }
  function renderLib() {
    $('lib').innerHTML = S.emo.map(function (e) {
      var n = countTok(e);
      var cnt = n ? '×' + n : (S.used[e] ? '✓' : '—');
      return '<button type="button" class="entry" data-e="' + e + '" aria-pressed="' + (S.armed === e) + '"><span class="em">' + e + '</span><span class="eq">=</span><span class="str">“' + esc(S.lib[e]) + '”</span><span class="cnt' + (!n && S.used[e] ? ' ok' : '') + '">' + cnt + '</span></button>';
    }).join('');
  }
  function renderAll() { renderSteps(); renderDoc(); renderLib(); $('step').disabled = S.solved; }

  function startLesson(i) {
    S.i = i;
    var L = LES[S.lang][i];
    S.lib = {}; S.emo = [];
    L.lib.forEach(function (p) { S.lib[p[0]] = p[1]; S.emo.push(p[0]); });
    S.re = new RegExp('(' + S.emo.join('|') + ')');
    S.nodes = parse(L.text, 0);
    S.used = {}; S.armed = null; S.solved = false;
    $('l-title').textContent = t('lesson') + ' ' + (i + 1) + ' · ' + L.title;
    $('l-intro').textContent = L.intro;
    $('l-task').textContent = L.task;
    $('res').hidden = true;
    say(t('tip'));
    renderAll();
  }

  function place(i, e) {
    var node = S.nodes[i];
    if (S.solved || !node || node.k !== 'tok') return;
    if (node.e !== e) {
      say(t('wrong')(node.e, e), true);
      var el = $('doc').querySelector('.tok[data-i="' + i + '"]');
      if (el) { el.classList.add('no'); setTimeout(function () { el.classList.remove('no'); }, 400); }
      return;
    }
    S.used[e] = 1;
    var rep = parse(S.lib[e], node.d + 1);
    rep.forEach(function (n) { n.fresh = true; });
    S.nodes.splice.apply(S.nodes, [i, 1].concat(rep));
    S.armed = null;
    say('');
    renderAll();
    if (!S.nodes.some(function (n) { return n.k === 'tok'; })) finish();
  }

  function finish() {
    S.solved = true; S.done[S.lang + S.i] = true;
    var L = LES[S.lang][S.i];
    var orig = len(expandAll(L.text)), txt = len(L.text), lib = 0;
    L.lib.forEach(function (p) { lib += 1 + len(p[1]); });
    var ratio = orig / (txt + lib);
    $('r-status').textContent = t('done');
    $('r-after').textContent = L.after;
    $('comp').innerHTML = '<div class="label">' + t('comp') + '</div><div class="ratio' + (ratio < 0.9999 ? ' bad' : '') + '">' + ratio.toFixed(2).replace('.', ',') + ':1</div><div class="meta">' + esc(t('meta')(orig, txt, lib)) + '</div>';
    $('next').textContent = S.i + 1 < LES[S.lang].length ? t('next') : t('again');
    $('res').hidden = false;
    renderAll();
    var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    $('res').scrollIntoView({ block: 'nearest', behavior: calm ? 'auto' : 'smooth' });
  }

  /* drag and tap */
  var drag = null, overEl = null;
  function tokAt(x, y) { var el = document.elementFromPoint(x, y); return el && el.closest ? el.closest('.tok') : null; }
  function setOver(el) { if (overEl && overEl !== el) overEl.classList.remove('over'); overEl = el; if (el) el.classList.add('over'); }
  function endDrag() {
    if (!drag) return;
    if (drag.ghost && drag.ghost.parentNode) drag.ghost.parentNode.removeChild(drag.ghost);
    drag.row.classList.remove('lifted');
    setOver(null); drag = null;
  }
  var lib = $('lib');
  lib.addEventListener('pointerdown', function (e) {
    var row = e.target.closest('.entry');
    if (!row || S.solved || (e.pointerType === 'mouse' && e.button !== 0)) return;
    drag = { row: row, e: row.dataset.e, x: e.clientX, y: e.clientY, moved: false, ghost: null, id: e.pointerId, touch: e.pointerType !== 'mouse' };
    try { row.setPointerCapture(e.pointerId); } catch (err) {}
  });
  lib.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    if (!drag.moved) {
      if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
      drag.moved = true;
      var g = document.createElement('div');
      g.className = 'ghost'; g.textContent = drag.e + ' = ' + S.lib[drag.e];
      document.body.appendChild(g);
      drag.ghost = g; drag.row.classList.add('lifted');
    }
    drag.ghost.style.transform = 'translate(' + e.clientX + 'px,' + e.clientY + 'px) translate(-50%,' + (drag.touch ? '-160%' : '-130%') + ')';
    setOver(tokAt(e.clientX, e.clientY));
  });
  lib.addEventListener('pointerup', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var d = drag;
    if (d.moved) {
      var tk = tokAt(e.clientX, e.clientY);
      S.suppressUntil = performance.now() + 300;
      endDrag();
      if (tk) place(+tk.dataset.i, d.e);
    } else { endDrag(); }
  });
  lib.addEventListener('pointercancel', endDrag);
  lib.addEventListener('click', function (e) {
    if (performance.now() < S.suppressUntil) return;
    var row = e.target.closest('.entry');
    if (!row || S.solved) return;
    S.armed = S.armed === row.dataset.e ? null : row.dataset.e;
    renderLib(); $('doc').classList.toggle('armed', S.armed !== null);
  });
  $('doc').addEventListener('click', function (e) {
    var tk = e.target.closest('.tok');
    if (!tk) return;
    if (S.armed === null) { say(t('tip')); return; }
    place(+tk.dataset.i, S.armed);
  });
  $('step').addEventListener('click', function () {
    if (S.solved) return;
    for (var i = 0; i < S.nodes.length; i++) {
      if (S.nodes[i].k === 'tok') {
        var e = S.nodes[i].e;
        place(i, e);
        var row = $('lib').querySelector('.entry[data-e="' + e + '"]');
        if (row) { row.classList.add('pulse'); setTimeout(function () { row.classList.remove('pulse'); }, 700); }
        return;
      }
    }
  });
  $('reset').addEventListener('click', function () { startLesson(S.i); });
  $('steps').addEventListener('click', function (e) {
    var b = e.target.closest('.step');
    if (b) startLesson(+b.dataset.i);
  });
  $('next').addEventListener('click', function () { startLesson(S.i + 1 < LES[S.lang].length ? S.i + 1 : 0); });
  $('l-uk').addEventListener('click', function () { if (S.lang !== 'uk') { S.lang = 'uk'; applyLang(); startLesson(S.i); } });
  $('l-en').addEventListener('click', function () { if (S.lang !== 'en') { S.lang = 'en'; applyLang(); startLesson(S.i); } });

  applyLang();
  startLesson(0);
})();
</script>

</body></html>
